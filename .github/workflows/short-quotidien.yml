name: Short quotidien

on:
  schedule:
    - cron: "47 6 * * *" # tous les jours vers 06:47 UTC (= heure d'Abidjan)
  workflow_dispatch:
    inputs:
      idee:
        description: "id de l'idée (vide = prochaine « a_faire »)"
        required: false
        default: ""
      essai:
        description: "Essai : ne pas marquer l'idée comme faite ni publier de release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: short-quotidien
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shorts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shorts/remotion/package-lock.json

      - name: Outils système
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Dépendances
        run: |
          pip install -r requirements.txt
          npm ci --prefix remotion
          npx --prefix remotion remotion browser ensure

      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Produire le Short du jour
        id: short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEE: ${{ inputs.idee }}
          ESSAI: ${{ inputs.essai }}
        run: |
          ARGS=""
          if [ -n "$IDEE" ]; then ARGS="$ARGS --idee $IDEE"; fi
          if [ "$ESSAI" = "true" ]; then ARGS="$ARGS --essai"; fi
          python -m pipeline.main $ARGS

      - name: Fichiers de la vidéo (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.short.outputs.nom }}
          path: |
            ${{ steps.short.outputs.dossier }}/short.mp4
            ${{ steps.short.outputs.dossier }}/publication.txt
            ${{ steps.short.outputs.dossier }}/sous-titres.srt
            ${{ steps.short.outputs.dossier }}/miniature.jpg
            ${{ steps.short.outputs.dossier }}/metadata.json
            ${{ steps.short.outputs.dossier }}/script.json
          retention-days: 30

      - name: Release (téléchargeable depuis le téléphone)
        if: ${{ inputs.essai != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOSSIER: ${{ steps.short.outputs.dossier }}
          NOM: ${{ steps.short.outputs.nom }}
          TITRE: ${{ steps.short.outputs.titre }}
        run: |
          FICHIERS=("$DOSSIER/short.mp4" "$DOSSIER/miniature.jpg" "$DOSSIER/sous-titres.srt" "$DOSSIER/publication.txt")
          gh release create "short-$NOM" "${FICHIERS[@]}" \
            --title "$TITRE" --notes-file "$DOSSIER/publication.txt" --target "$GITHUB_SHA" \
            || gh release upload "short-$NOM" "${FICHIERS[@]}" --clobber

      - name: Marquer l'idée comme faite
        if: ${{ inputs.essai != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idees.csv
          git diff --cached --quiet || git commit -m "Short du jour : ${{ steps.short.outputs.nom }}"
          git push
